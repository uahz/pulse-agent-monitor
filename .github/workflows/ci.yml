name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  # ---------------- PC 端：四套验证（Qt offscreen）----------------
  desktop-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Qt 运行所需系统库（offscreen）
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: 安装 Python 依赖
        run: pip install PySide6 segno zxing-cpp websocket-client pillow
      - name: 语法检查
        run: python -m py_compile pulse_core.py pulse_desktop.py pulse_events.py pulse_pair_server.py verify_pair.py verify_desktop.py verify_events.py verify_p1.py verify_p3.py
      - name: verify_events（42 项 · 事件引擎）
        run: QT_QPA_PLATFORM=offscreen python verify_events.py
      - name: verify_pair（22 项 · 配对契约）
        run: QT_QPA_PLATFORM=offscreen python verify_pair.py
      - name: verify_desktop（11 项 · 轻量单窗）
        run: QT_QPA_PLATFORM=offscreen python verify_desktop.py
      - name: verify_p1（28 项 · 长轮询/SSE/token 持久化/移动端 Chromium）
        run: QT_QPA_PLATFORM=offscreen python verify_p1.py
      - name: verify_p3（20 项 · 手机端写命令）
        run: QT_QPA_PLATFORM=offscreen python verify_p3.py

  # ---------------- Android 端：构建 + 验签检查 ----------------
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK 组件（runner 自带 sdkmanager）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
      - name: 构建签名 APK
        run: bash mobile/android/build.sh
      - name: 验签与完整性
        run: |
          APK=releases/PULSE_v1.6.0.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify "$APK"
          "$BT/zipalign" -c 4 "$APK"
          unzip -t "$APK" > /dev/null
          "$BT/aapt" dump badging "$APK" | grep -E "package: name='com.pulse.app'"
      - uses: actions/upload-artifact@v4
        with:
          name: PULSE-v1.6.0-apk
          path: releases/PULSE_v1.6.0.apk

  # ---------------- Windows 单文件 exe（仅 tag 触发）----------------
  build-windows-exe:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: python -m pip install PySide6 segno pyinstaller
      - name: 打包 Windows .exe
        run: .\build_exe.bat
      - name: 核验 exe
        run: |
          $f = "dist/PULSE_Desktop.exe"
          if (-not (Test-Path $f)) { throw "missing PULSE_Desktop.exe" }
          Get-Item $f | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: PULSE-Desktop-exe
          path: desktop/dist/PULSE_Desktop.exe
          if-no-files-found: error

  # ---------------- 发版：tag v* 触发 ----------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-tests, android-build, build-windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 整理产物
        run: |
          mkdir -p releases desktop/dist
          cp artifacts/PULSE-v1.6.0-apk/PULSE_v1.6.0.apk releases/
          cp artifacts/PULSE-Desktop-exe/PULSE_Desktop.exe desktop/dist/
          ls -la releases desktop/dist
          file desktop/dist/PULSE_Desktop.exe
      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES="Windows: PULSE_Desktop.exe (double-click to run). Android: PULSE_v1.6.0.apk. The pairing QR code is built into the desktop app. See README."
          gh release create "$TAG" \
            --title "PULSE $TAG" \
            --notes "$NOTES" \
            releases/PULSE_v1.6.0.apk desktop/dist/PULSE_Desktop.exe || \
          gh release upload "$TAG" releases/PULSE_v1.6.0.apk desktop/dist/PULSE_Desktop.exe --clobber
